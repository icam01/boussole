<style id="lockcss">
:root{color-scheme:light dark;--bg:#12202E;--card:#FFFFFF;--ink:#12202E;--muted:#566473;--line:#CDD6DF;--field:#FFFFFF;--blue:#1F4FD1;--on-blue:#FFFFFF;--crit:#BE2C24}
@media (prefers-color-scheme:dark){:root{--bg:#091018;--card:#152130;--ink:#E7EEF5;--muted:#93A2B2;--line:#28394B;--field:#0F1A26;--blue:#8BB0FF;--on-blue:#0D151E;--crit:#FF8D83}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px))}
main{width:min(380px,100%)}
.lk-h{display:flex;align-items:center;gap:11px;color:#fff;margin:0 0 18px}
.lk-h svg{width:36px;height:36px;flex:none}
.lk-h h1{margin:0;font:700 28px/1 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
.lk-h p{margin:3px 0 0;font-size:13px;color:#8EA0B2}
form{background:var(--card);border-radius:12px;padding:20px;display:grid;gap:10px}
label{font-size:13px;color:var(--muted)}
input{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--field);color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px;background:var(--blue);color:var(--on-blue);cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#lkm{margin:0;font-size:13.5px;color:var(--muted)}
#lkm:empty{display:none}
.keep{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);padding:2px 0 4px}
.keep input{width:18px;height:18px;flex:none;padding:0;accent-color:var(--blue)}
#lkm.err{color:var(--crit)}
</style>
</head>

<script>
(function(){
const V=JSON.parse(document.getElementById('vault').textContent);
const ub=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const f=document.getElementById('lkf'),p=document.getElementById('lkp'),m=document.getElementById('lkm'),bt=document.getElementById('lkb');
const say=(t,err)=>{m.textContent=t;m.className=err?'err':''};
async function dec(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(V.i)},key,ub(V.c));return JSON.parse(new TextDecoder().decode(pt))}
function start(a){
 document.getElementById('lockcss').remove();
 const st=document.createElement('style');st.textContent=a.css;document.head.appendChild(st);
 document.body.innerHTML=a.body;
 const b=document.createElement('script');b.type='application/json';b.id='bundle';b.textContent=a.bundle;document.body.appendChild(b);
 window.BQ_SNAP=a.data;
 const s=document.createElement('script');s.textContent=a.js;document.body.appendChild(s);
}
if(!window.crypto||!crypto.subtle){say('Ce navigateur ne peut pas ouvrir cette page. Ouvre le lien en https, dans un navigateur récent.',1);bt.disabled=true;return}
const kept=()=>{try{return sessionStorage.getItem('bq-k')||localStorage.getItem('bq-k')}catch(e){return null}};
const drop=()=>{try{sessionStorage.removeItem('bq-k')}catch(e){}try{localStorage.removeItem('bq-k')}catch(e){}};
(async()=>{try{const k=kept();if(!k)return;const key=await crypto.subtle.importKey('raw',ub(k),'AES-GCM',false,['decrypt']);start(await dec(key))}catch(e){drop()}})();
f.addEventListener('submit',async e=>{e.preventDefault();if(bt.disabled)return;bt.disabled=true;say('Vérification…');
 try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value.trim()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(V.s),iterations:V.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
  const a=await dec(key);
  try{const raw=b64(new Uint8Array(await crypto.subtle.exportKey('raw',key)));sessionStorage.setItem('bq-k',raw);if(document.getElementById('lkk').checked)localStorage.setItem('bq-k',raw)}catch(e2){}
  start(a)}
 catch(err){bt.disabled=false;say('Mot de passe incorrect.',1);p.select()}});
p.focus();
})();
</script>
